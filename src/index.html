<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SanctuaryAI</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#33206b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <app-root>
      <main class="startup-status" aria-live="polite" aria-busy="true">
        <img src="/logo.svg" alt="SanctuaryAI" class="startup-status__logo" />
        <div class="startup-status__card">
          <p class="startup-status__eyebrow">SanctuaryAI</p>
          <h1>Preparing your workspace…</h1>
          <p>Please wait while the application loads.</p>
          <span class="startup-status__spinner" aria-hidden="true"></span>
        </div>
      </main>
    </app-root>
    <noscript>SanctuaryAI requires JavaScript.</noscript>
  </body>
</html>
